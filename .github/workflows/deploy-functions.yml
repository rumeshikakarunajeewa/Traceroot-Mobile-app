name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - Hemalsha
    paths:
      - 'backend/functions/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Functions to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy verify-live-capture --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'twwuqaxmoiaqmvvcwqqw' }} --yes
          supabase functions deploy send-notification --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'twwuqaxmoiaqmvvcwqqw' }} --yes
          supabase functions deploy sync-offline-records --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'twwuqaxmoiaqmvvcwqqw' }} --yes
