name: Deploy Database Migrations to Supabase

on:
  push:
    branches:
      - main
      - Hemalsha
    paths:
      - 'database/migrations/**'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

jobs:
  deploy-database:
    name: Push Migrations to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Migrations to Supabase Cloud
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'twwuqaxmoiaqmvvcwqqw' }} --workdir database
          supabase db push --remote --workdir database
